[project]
name = "multi-auth-api"
version = "0.1.0"
description = "FastAPI multi-method authentication API: Twilio Verify, Google OIDC, GitHub OAuth"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
    "authlib>=1.3.2",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "twilio>=9.3.0",
    "google-auth>=2.62.0",
]

[tool.uv]
package = false
